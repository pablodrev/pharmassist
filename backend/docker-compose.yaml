services:
  db:
    image: postgres:18-alpine
    container_name: postgres18
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pharmadb
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d pharmadb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pharma-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pharma-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://user:password@db:5432/pharmadb
      SECRET_KEY: your-secret-key-here-change-in-production
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      PYTHONUNBUFFERED: 1
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pharma-network
    volumes:
      - ./api:/app/api
      - ./core:/app/core
      - ./services:/app/services
      - ./models:/app/models
      - ./tests:/app/tests
      - ./auth.py:/app/auth.py
      - ./db.py:/app/db.py
      - ./api_schemas.py:/app/api_schemas.py
      - hf_cache:/root/.cache/huggingface
    command: sh -c "sleep 2 && uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload"

  # frontend:
  #   build:
  #     context: ../pharmassist
  #     dockerfile: Dockerfile
  #   container_name: pharmassist-frontend
  #   ports:
  #     - "3000:80"
  #   depends_on:
  #     - backend
  #   networks:
  #     - pharma-network

volumes:
  postgres_data:
  hf_cache:
networks:
  pharma-network:
    driver: bridge